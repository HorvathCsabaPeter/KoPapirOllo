<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KoPairOllo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="rendezo">

        <div class="main">
            <div class="urlapBox">
                <h1>Reg!</h1>
                <input id="emailIp" placeholder="parti@turr.hu" type="text">
                <input id="userIp" placeholder="Név" maxlength="20" type="text">
                <button onclick="check()">Mehet!</button>
                <p id="hiba">dawdawdawdawdada</p>
            </div>

            <div id="nyertBlock" class="KozepNyer">
                <h1 class="vegsoH1"><span id="nyertesSpan"></span> nyert!</h1>
                <button class="bt" onclick="resi()">Resi</button>
                <p>Te pontod</p>
                <p id="tePontEnd" class="pirosP">0</p>
                <p>Gép pontja</p>
                <p id="gepPontEnd" class="pirosP">0</p>
            </div>

            <div id="tunes" class="tunes">
            <h1>Kő - Papír - Olló</h1>
            <h2>Válassz!</h2>
            <div class="imgContainer">
                <img id="koImg" onclick="play('ko')" class="seletedImg" src="img/ko.png" alt="">
                <img id="papirImg" onclick="play('papir')" class="seletedImg" src="img/papir.png" alt="">
                <img id="olloImg" onclick="play('ollo')" class="seletedImg" src="img/ollo.png" alt="">
            </div>
            <h2>Gép választása</h2>
            <img id="gepKep" src="img/ollo.png" alt="">

            <h1>Eredmény: <span id="nyertes">----</span>!</h1>
            <p>Te pontod</p>
            <p id="tePont" class="pirosP">0</p>
            <p>Gép pontja</p>
            <p id="gepPont" class="pirosP">0</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
