
<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kő Papír Olló</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="rendezo">

        <div class="main">

            
            <div id="urlapBox" class="urlapBox">

                
                <h1>Regisztráció</h1>

                <input
                    id="emailIp"
                    placeholder="csaba@turr.hu"
                    type="text"
                >

                <input
                    id="userIp"
                    placeholder="Név"
                    type="text"
                    minlength="8"
                    maxlength="20"
                >

                <button onclick="check()">Mehet!</button>

                <p id="hiba"></p>

            </div>


           
            <div id="nyertBlock" class="KozepNyer">
                <h1 class="vegsoH1">Nyertes: <span id="nyertesSpan"></span></h1>
                <p>Te: <span id="tePontEnd">0</span> | Gép: <span id="gepPontEnd">0</span></p>
                <button type="button" class="bt" onclick="resi()">Újrainditas</button>
            </div>


           
            <div id="tunes" class="tunes" style="display: none;">

                

                <h2>Válassz!</h2>

                <div class="imgContainer">

                    <img
                        id="koImg"
                        onclick="play('ko')"
                        class="seletedImg"
                        src="img/ko.png"
                        alt="Kő"
                    >

                    <img
                        id="papirImg"
                        onclick="play('papir')"
                        class="seletedImg"
                        src="img/papir.png"
                        alt="Papír"
                    >

                    <img
                        id="olloImg"
                        onclick="play('ollo')"
                        class="seletedImg"
                        src="img/ollo.png"
                        alt="Olló"
                    >

                </div>

                <h2>Gép választása</h2>

                <img id="gepKep" src="img/ollo.png" alt="Gép választása">

                <h3>
                    
                    <span id="nyertes"></span>
                </h3>

                <p id="userNameh1"> pontod</p>
                <p id="tePont" class="pirosP">0</p>

                <p>Gép pontja</p>
                <p id="gepPont" class="pirosP">0</p>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
